name: Verify FinPilot
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m pip install -r services/analytics/requirements.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: python -m unittest discover -s services/analytics -v
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finpilot_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: finpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://finpilot_test:ephemeral-ci-only@localhost:5432/finpilot_test
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Generate isolated test session secret
        run: node -e "const secret=require('crypto').randomBytes(48).toString('hex'); console.log('::add-mask::'+secret); require('fs').appendFileSync(process.env.GITHUB_ENV, 'SESSION_SECRET=' + secret + '\n')"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test
