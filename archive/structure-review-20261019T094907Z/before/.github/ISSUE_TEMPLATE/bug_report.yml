name: Bug report
description: Report a reproducible problem in the synthetic sandbox.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the route, expected behavior, actual behavior, and storage mode. Use synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized error
      description: Node/Python/browser versions and a correlation ID if available. Never paste cookies, approval tokens, API keys, passwords, or real financial data.
